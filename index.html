<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Home Page</title>
    <style>
        :root {
            --bg1: #0f172a;
            --bg2: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: min(900px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            border-bottom: 1px solid #e5e7eb;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--bg1);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            padding: 48px 32px;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 4vw, 4rem);
            line-height: 1.1;
            margin: 0 0 16px;
            color: var(--bg1);
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--muted);
            margin: 0 0 24px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-secondary {
            background: #e0e7ff;
            color: var(--bg1);
        }

        .card {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 1.25rem;
        }

        .stat {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--bg2);
            margin: 10px 0;
        }

        @media (max-width: 700px) {
            .nav {
                flex-direction: column;
                gap: 14px;
            }

            .hero {
                grid-template-columns: 1fr;
                padding: 32px 24px;
            }

            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            <nav class="nav">
                <div class="brand">BrightStudio</div>
                <div class="nav-links">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Services</a>
                    <a href="#">Contact</a>
                </div>
            </nav>

            <section class="hero">
                <div>
                    <h1>Build something amazing.</h1>
                    <p>
                        We create simple, modern, and effective digital experiences that help businesses grow.
                    </p>
                    <div class="buttons">
                        <a class="btn btn-primary" href="#">Get Started</a>
                        <a class="btn btn-secondary" href="#">Learn More</a>
                    </div>
                </div>

                <div class="card">
                    <h3>Creative Growth</h3>
                    <span class="stat">+120%</span>
                    <p>More engagement and better results for your brand.</p>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
